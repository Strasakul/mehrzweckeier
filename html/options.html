<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Replacer Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #f9f9f9;
      color: #333;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    h2 { font-weight: 700; }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #0d6efd;
      color: white;
    }
    button:hover { background-color: #0b5ed7; }
    button.delete-btn {
      background-color: #dc3545;
      padding: 5px 10px;
    }
    button.delete-btn:hover { background-color: #bb2d3b; }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 10px 15px;
      border: 1px solid #ddd;
      margin-bottom: 8px;
      border-radius: 4px;
    }
    
    @media (prefers-color-scheme: dark) {
      body { background-color: #1e1e1e; color: #e0e0e0; }
      input[type="text"] { background-color: #2d2d2d; color: #fff; border-color: #555; }
      li { background: #2d2d2d; border-color: #444; }
    }
  </style>
</head>
<body>
  <h2>Dictionary Rules</h2>
  
  <div class="input-group">
    <input type="text" id="targetWord" placeholder="Word (e.g. summer)">
    <input type="text" id="replacementWord" placeholder="Replacement (e.g. Florida)">
    <button id="addBtn">Add Rule</button>
  </div>

  <ul id="ruleList"></ul>

  <script src="/src/options.js"></script>
</body>
</html>
