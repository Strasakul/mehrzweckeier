<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 160px;
      text-align: center;
      padding: 15px;
      font-family: 'JetBrains Mono', monospace;
      background-color: #f9f9f9;
      color: #333333;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.5px;
    }
    .status-text {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
      display: block;
      transition: color 0.3s;
    }
    
    /* Toggle Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #28a745; /* Green for ON */
    }
    input:checked + .slider:before {
      transform: translateX(24px); /* Moves the circle to the right */
    }

    /* Dark Mode Overrides */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #e0e0e0;
      }
      .slider {
        background-color: #555; /* Darker off-state track */
      }
      input:checked + .slider {
        background-color: #75b798; /* Muted green for dark mode */
      }
    }
  </style>
</head>
<body>
  <h3>MEHRZWECKEIER</h3>
  <span id="statusText" class="status-text">Loading...</span>
  
  <!-- The Toggle Switch -->
  <label class="switch">
    <input type="checkbox" id="toggleSwitch">
    <span class="slider"></span>
  </label>
  
  <script src="/src/popup.js"></script>
</body>
</html>
